# Loki monolítico com armazenamento em disco (volume loki_data).
auth_enabled: false # só é alcançável pela rede interna `obs`

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  log_format: json
  # lotes do pattern ingester passam do padrão de 4 MiB
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    # Nunca edite um período existente; para mudar, acrescente um novo com data futura.
    - from: "2026-09-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  retention_period: 720h # 30 dias
  retention_stream:
    - selector: '{source="journal"}' # trilha de segurança do host: 90 dias
      priority: 1
      period: 2160h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 4MB
  per_stream_rate_limit_burst: 16MB
  max_label_names_per_series: 15
  max_query_series: 5000
  max_query_parallelism: 8
  max_entries_limit_per_query: 5000
  allow_structured_metadata: true
  volume_enabled: true
  discover_log_levels: true

pattern_ingester:
  enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

frontend:
  encoding: protobuf

ruler:
  enable_api: false # alertas ficam no Grafana

analytics:
  reporting_enabled: false
