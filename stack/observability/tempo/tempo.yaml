# Tempo 3 monolítico (-target=all), armazenamento local, com metrics-generator.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info
  log_format: json

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  # O padrão (2048) corta prompts/respostas de LLM nos atributos dos spans.
  max_attribute_bytes: 32768

metrics_generator:
  registry:
    external_labels:
      source: tempo
    collection_interval: 30s
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 15000000
      burst_size_bytes: 20000000
    global:
      max_bytes_per_trace: 20000000 # traces de agente com I/O de LLM são grandes
    compaction:
      block_retention: 168h # 7 dias: traces contêm prompts e saídas de ferramentas
    metrics_generator:
      processors: [span-metrics, service-graphs]
      generate_native_histograms: both
      processor:
        span_metrics:
          # SÓ dimensões de baixa cardinalidade (nunca ids de conversa/sessão)
          dimensions:
            - gen_ai.system
            - gen_ai.request.model
        service_graphs:
          dimensions: []

usage_report:
  reporting_enabled: false
